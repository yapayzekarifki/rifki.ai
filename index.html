<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Rıfkı AI</title>
    <style>
        :root { --bg-side: #121212; --bg-chat: #1a1a1a; --text: #e0e0e0; --border: #333; --accent: #ffffff; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; background: var(--bg-chat); color: var(--text); overflow: hidden; }

        .sidebar { 
            width: 260px; background: var(--bg-side); border-right: 1px solid var(--border); 
            display: flex; flex-direction: column; padding: 20px; 
        }
        .btn-new { 
            border: 1px solid var(--border); padding: 12px; border-radius: 8px; 
            text-align: center; cursor: pointer; margin-bottom: 20px; font-weight: bold; 
            background: var(--bg-chat); transition: 0.2s;
        }
        .btn-new:hover { background: #252525; }
        
        .history { flex: 1; overflow-y: auto; }
        .history-item { 
            padding: 10px; cursor: pointer; border-radius: 6px; margin-bottom: 5px; 
            font-size: 14px; border-bottom: 1px solid var(--border); 
            text-overflow: ellipsis; white-space: nowrap; overflow: hidden; opacity: 0.8;
        }
        .history-item:hover { background: var(--border); opacity: 1; }
        .sidebar-footer { padding-top: 15px; font-size: 11px; opacity: 0.5; text-align: center; border-top: 1px solid var(--border); }

        .main { flex: 1; display: flex; flex-direction: column; position: relative; }
        #chat { 
            flex: 1; overflow-y: auto; padding: 40px 15% 120px 15%; 
            display: flex; flex-direction: column; gap: 20px; 
        }

        .msg { padding: 16px; border-radius: 12px; line-height: 1.6; max-width: 80%; border: 1px solid var(--border); font-size: 16px; }
        .user { align-self: flex-end; background: #333; }
        .bot { align-self: flex-start; background: #111; border-left: 4px solid #fff; }

        .input-container {
            position: absolute; bottom: 30px; left: 15%; right: 15%;
            background: #222; border: 1px solid var(--border); border-radius: 15px; 
            padding: 10px 15px; display: flex; gap: 15px; align-items: center;
        }
        #msg-in { 
            flex: 1; background: transparent; border: none; color: #fff; 
            outline: none; font-size: 16px; padding: 5px;
        }
        .send-btn { 
            background: #fff; color: #000; border: none; padding: 10px 25px; 
            border-radius: 10px; cursor: pointer; font-weight: bold; 
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div style="font-size: 20px; font-weight: bold; margin-bottom: 20px; letter-spacing: 1px;">RIFKI AI</div>
        <div class="btn-new" onclick="newChat()">+ Yeni Sohbet</div>
        <div class="history" id="h-list"></div>
        <div class="sidebar-footer">
            Rıfkı AI hata yapabilir. Kontrol ediniz.
        </div>
    </div>

    <div class="main">
        <div id="chat"></div>
        <div class="input-container">
            <input type="text" id="msg-in" placeholder="Bir şeyler yazın..." onkeydown="if(event.key==='Enter') send()">
            <button class="send-btn" onclick="send()">Gönder</button>
        </div>
    </div>

<script>
    const _k = "QUl6YVN5RG10MTFQc1UtUWx1Q1R6ZXNhVjRKdEFoVW5sQ1QwbU5Z";
    const API_KEY = atob(_k);
    let chatHistory = [];
    let savedChats = JSON.parse(localStorage.getItem("rifki_pc_chats") || "[]");

    window.onload = () => {
        renderHistory();
        addMessage("Merhaba, ben Rıfkı AI. Size nasıl yardımcı olabilirim?", "bot");
    };

    function renderHistory() {
        const list = document.getElementById("h-list");
        list.innerHTML = "";
        savedChats.forEach((chat, index) => {
            const item = document.createElement("div");
            item.className = "history-item";
            item.innerText = chat.title || "Sohbet " + (index + 1);
            item.onclick = () => loadChat(index);
            list.appendChild(item);
        });
    }

    function newChat() {
        if (chatHistory.length > 0) {
            const title = chatHistory[0].parts[0].text.substring(0, 25);
            savedChats.unshift({ title: title, history: chatHistory });
            localStorage.setItem("rifki_pc_chats", JSON.stringify(savedChats));
        }
        chatHistory = [];
        document.getElementById("chat").innerHTML = "";
        addMessage("Yeni bir sohbet başladı.", "bot");
        renderHistory();
    }

    function loadChat(index) {
        chatHistory = savedChats[index].history;
        document.getElementById("chat").innerHTML = "";
        chatHistory.forEach(msg => addMessage(msg.parts[0].text, msg.role === "user" ? "user" : "bot"));
    }

    function addMessage(text, type) {
        const div = document.createElement("div");
        div.className = "msg " + type;
        div.innerText = text;
        const chat = document.getElementById("chat");
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    async function send() {
        const inp = document.getElementById("msg-in");
        const val = inp.value.trim();
        if(!val) return;

        addMessage(val, "user");
        inp.value = "";
        chatHistory.push({ role: "user", parts: [{ text: val }] });

        try {
            // Modeli senin istediğin gibi bırakıyorum (2.5-flash)
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    systemInstruction: { 
                        parts: [{ text: "Sen Rıfkı AI'sın. Seni Kağan kodladı. 'Seni kim yaptı?' sorusuna 'Beni Kağan yaptı' de. Karşındakinin ismini öğrenince unutma. Sorulmadan 'Sen Kağan'sın' deme." }] 
                    },
                    contents: chatHistory
                })
            });

            const data = await res.json();

            // Veri yapısı kontrolü
            if (data.candidates && data.candidates.length > 0 && data.candidates[0].content) {
                const reply = data.candidates[0].content.parts[0].text;
                addMessage(reply, "bot");
                chatHistory.push({ role: "model", parts: [{ text: reply }] });
            } else if (data.error) {
                // Eğer API bir hata mesajı döndürürse ekrana yazdır
                addMessage("API Hatası: " + data.error.message, "bot");
                console.log("Detaylı Hata:", data.error);
            } else {
                addMessage("Yanıt formatı uyuşmadı, bağlantıyı kontrol edin.", "bot");
            }

        } catch(e) {
            addMessage("Bağlantı kurulamadı. Lütfen internetini kontrol et.", "bot");
            console.error("Fetch Hatası:", e);
        }
    }
</script>

</body>
</html>
